<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }
        .formContainer{
            background-color: white;
            border:12px solid darkblue;
            border-radius:35px;
            width:500px;
            margin:20px;
            overflow: hidden;
        }
        #myForm{
            display: grid;
            grid-template-rows:1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr ;
            grid-template-columns: 1fr 1fr;
            padding:20px;
            gap:10px;
            align-items: center;
            font-size: 16px;
        }
        footer{
            display:grid;
            grid-template-columns:1fr 1fr 1fr 1fr 1fr;
            grid-template-rows:1fr ;
            gap:1px;
            background-color: white; 
        }
        header{
            display:grid;
            grid-template-columns: 1fr ;
            grid-template-rows: 2fr 1fr 1fr;
            text-align: center;
            height:210px;
            width:100%;
            overflow: hidden;
            position: relative;
           
        }
        .background{
            grid-row: 1/4;
            grid-column: 1;
            z-index: 1;
            position:absolute;
            object-fit: cover;
            height:100%;
            width:100%;
            object-position: top;
        }
        h1{
            color:white;
            text-shadow: 5px 5px 5px black;
            z-index: 2;
            grid-row: 2;
            grid-column: 1;
            font-size:40px;

        }
        h2{
            color:white;
            text-shadow: 5px 5px 5px black;
            z-index:2;
            grid-row: 3;
            grid-column: 1;
            font-size:30px;
        }
        h3{
            grid-row:1;
            grid-column:1;
            text-align: center;
            padding: 20px;
            font-size:20px;
        }
        footer img {
            width: 100%;
            
            
        }
        .newsletter{
            grid-row:6;
            grid-column:1/3;
            text-align: center;
        }
        .checkbox{
            grid-row:7;
            grid-column:1/3;
            text-align: center;
        }
        .submit{
            grid-row:8;
            grid-column:1/3;
            text-align: center;
            
        }
        .button{
            position: absolute;
            top: 10px;
            left: 15px;
            z-index: 3;
        }
        

    </style>

    

</head>

<body>
    <div id="formContainer" class="formContainer">
    
        <header>
            <button class="button" type="button" id="closeBtn">X</button>
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
            <img class="background" src="images/jesus_feeds_5000.jpeg">
        </header>

        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label class="label" for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label class="email" for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label class="gender">Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section class="newsletter">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section class="checkbox">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section class="submit">
                <button type="submit">Submit</button>
            </section>
            
        </form>
        <footer>
                <img class="book" src="images/old_testament.webp">
                <img class="book" src="images/new_testament.webp">
                <img class="book" src="images/book_of_mormon.webp">
                <img class="book" src="images/doctrine_and_covenants.webp">
                <img class="book" src="images/pearl_of_great_price.webp">
        </footer>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
