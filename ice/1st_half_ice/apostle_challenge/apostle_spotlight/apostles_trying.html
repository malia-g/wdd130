<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apostles Spotlights</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #e8eced;
    font-family: Arial, sans-serif;
  }

  .background {
    position: fixed;
    inset: 30px auto auto 50%;
    transform: translateX(-50%);
    width: min(708px, calc(100vw - 40px));
    height: min(548px, calc(100vh - 60px));
    overflow: hidden;
    border: 7px solid #050505;
    border-radius: 32px;
    z-index: -1;
  }

  .background img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border: 0;
    border-radius: 0;
  }

  h1,
  h2 {
    position: relative;
    color: white;
    text-align: center;
    font-weight: normal;
    margin: 0;
  }

  h1 {
    margin: 42px auto 4px;
    font-size: 30px;
  }

  .first_presidency {
    display: grid;
    grid-template-columns: repeat(3, 110px);
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-bottom: 10px;
  }

  .first_presidency img {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border: 7px solid white;
    border-radius: 50%;
  }

  h2 {
    margin: 0 auto 8px;
    font-size: 21px;
  }

  .apostles {
    display: grid;
    grid-template-columns: repeat(4, 82px);
    justify-content: center;
    column-gap: 18px;
    row-gap: 25px;
  }

  .apostles img {
    width: 82px;
    height: 82px;
    object-fit: cover;
    border: 6px solid white;
    border-radius: 50%;
  }

  .row_one,
  .row_two,
  .row_three {
    display: contents;
  }

  @media (max-width: 600px) {
    .background {
      top: 15px;
      height: calc(100vh - 30px);
      border-radius: 24px;
    }

    h1 {
      margin-top: 28px;
    }

    .first_presidency {
      grid-template-columns: repeat(3, 90px);
      gap: 12px;
    }

    .first_presidency img {
      width: 90px;
      height: 90px;
    }

    .apostles {
      grid-template-columns: repeat(4, 65px);
      column-gap: 8px;
      row-gap: 16px;
    }

    .apostles img {
      width: 65px;
      height: 65px;
      border-width: 4px;
    }
  }
</style>
</head>

<body>
  <section class="background">
    <img src="images/christus.webp" alt="">
  </section>

  <h1>First Presidency</h1>
  <section class="first_presidency">
    <img src="images/eyring.webp" alt="President Eyring">
    <img src="images/oaks.webp" alt="President Oaks">
    <img src="images/christofferson.webp" alt="President Christofferson">
  </section>

  <h2>Quorum of the Twelve Apostles</h2>
  <div class="apostles">
    <section class="row_one">
      <img src="images/uchtdorf.webp" alt="Elder Uchtdorf">
      <img src="images/bednar.webp" alt="Elder Bednar">
      <img src="images/cook.webp" alt="Elder Cook">
      <img src="images/anderson.webp" alt="Elder Anderson">
    </section>
    <section class="row_two">
      <img src="images/rasband.webp" alt="Elder Rasband">
      <img src="images/stevenson.webp" alt="Elder Stevenson">
      <img src="images/renlund.webp" alt="Elder Renlund">
      <img src="images/gong.webp" alt="Elder Gong">
    </section>
    <section class="row_three">
      <img src="images/soares.webp" alt="Elder Soares">
      <img src="images/kearon.webp" alt="Elder Kearon">
      <img src="images/causse.webp" alt="Elder Causse">
      <img src="images/gilbert.webp" alt="Elder Gilbert">
    </section>
  </div>
</body>
</html>
