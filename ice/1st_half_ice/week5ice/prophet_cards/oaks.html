<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dallin H. Oaks</title>
    <style>
        body {
            background: #FFECD7;
            display:grid;
            grid-template-columns:1fr 1fr 1fr ;
            grid-template-rows:1fr 1fr 1fr;
            align-items: center;
            align-self: center;

        }
        main{     
            width: 390px;
            text-align: center;      
           border: 4px solid;
           border-color:004E63;
            background-color: rgb(85, 172, 201);}
        h1{
            color: #FFFFFE;
            font-family: Arial, Helvetica, sans-serif;
            align-items: center;
            text-size-adjust:36px;
            border: 20px;

          
        }
        ul {color: #FFFFFE;
            text-size-adjust: 20px; 
             border: 20px;
        }
        a {color: #91E4FB;
            font-family: Arial, Helvetica, sans-serif;
            text-size-adjust: 18px; 
             border: 20px;
        }
        .quote {
            color: #FFD783;
            text-size-adjust: 20px;
             border: 20px; 
        }
        img{border-radius: 10px;
        border-color: white;
        border: 20px;}
        
    </style>
</head>
<body>
    <main>  
        <h1>Dallin H. Oaks</h1>
        <a href="churchofjesuschrist.org" title=18th President of the Church of Jesus Christ of Latter-day Saints></a>
        <img src="images/oaks.webp">
        <ul>
        <li>Born: Aug 12, 1932</li>
        <li>Apostle: Apr 17, 1984</li>
        <li>Prophet: Oct 14, 2025</li>
        </ul>
        <p class="quote">"The only permanent solution to the differences that divide us is for all of us to follow our Savior's teachings and to gradually become even as He is."</p>
    </main>
</body>
</html>
